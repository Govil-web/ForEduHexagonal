# ===================================================================
# PERFIL DE DESARROLLO (dev)
# ===================================================================
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
      dialect: org.hibernate.dialect.MySQLDialect

  # Desactivar caché en desarrollo para ver los cambios inmediatamente
  cache:
    type: none

  # Configuración de Redis para rate limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2
# Configuración de Logging Detallado
logging:
  level:
    root: INFO
    com.academia: DEBUG # Log detallado para nuestro código
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG # Muestra las queries SQL generadas
    org.hibernate.type.descriptor.sql: TRACE # Muestra los parámetros de las queries

# Configuración JWT para desarrollo
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION} # 15 minutos
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION} # 7 días
  #algorithm: ${JWT_ALGORITHM:HS512} # Algoritmo más fuerte
  #issuer: ${JWT_ISSUER:academia-system}
app:
  auth:
    max-login-attempts: 10 # Más permisivo en desarrollo
    login-attempt-window-minutes: 5
  security:
    allowed-origins: "http://localhost:3000,http://localhost:8080,http://localhost:4200"

