# ===================================================================
# PERFIL DE PRODUCCIÓN (prod)
# Optimizado para seguridad, rendimiento y fiabilidad.
# ===================================================================
spring:
  # Conexión a la base de datos de producción usando variables de entorno
  datasource:
    url: ${DATABASE_URL} # Ej: jdbc:mysql://prod-db.host:3306/academia_prod
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Nunca usar 'create' o 'update' en producción
      dialect: org.hibernate.dialect.MySQLDialect

  # Configuración de Redis para caché en producción
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2

  # Credenciales de correo desde variables de entorno
  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

# Logging para producción: Menos verboso, enfocado en errores
logging:
  level:
    root: INFO
    com.academia: WARN

# JWT Secret y expiración desde variables de entorno - CONFIGURACIÓN SEGURA
jwt:
  secret: ${JWT_SECRET} # OBLIGATORIO: 256+ bits de entropía
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:600000} # 10 min más corto
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:259200000} # 3 días más corto
  algorithm: ${JWT_ALGORITHM:HS512} # Algoritmo más fuerte
  issuer: ${JWT_ISSUER:academia-system-prod}
  audience: ${JWT_AUDIENCE:academia-api}

app:
  auth:
    max-login-attempts: ${AUTH_MAX_LOGIN_ATTEMPTS:3}
    login-attempt-window-minutes: ${AUTH_LOGIN_ATTEMPT_WINDOW:15} # Más estricto
  security:
    allowed-origins: ${ALLOWED_ORIGINS} # Variable de entorno obligatoria
    max-session-duration-minutes: ${MAX_SESSION_DURATION:30} # Más corto en prod
    require-https: true
    password-policy:
      min-length: 14 # Más estricto en producción
      require-special-chars: true
      require-numbers: true
      require-uppercase: true
      require-lowercase: true
    rate-limiting:
      enabled: true
      requests-per-minute: 100
      burst-size: 20



